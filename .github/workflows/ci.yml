name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Appið sjálft (m.a. RUKKApp.swift) er utan SwiftPM-marksins —
      # það byggist því sérstaklega svo villur þar komi ekki óvart í Archive.
      - name: Build the app target
        run: xcodebuild -project RUKK.xcodeproj -scheme RUKK -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
